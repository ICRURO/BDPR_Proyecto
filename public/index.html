<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foro Videojuegos - BDPR</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <div class="auth-navbar">
        <div id="auth-status" class="auth-status">
            <span class="auth-status-invited">Inicia sesión para participar</span>
        </div>
        <div id="auth-forms" class="auth-panel">
            <div class="auth-panel-block">
                <div class="auth-group">
                    <input type="text" id="login-id" placeholder="Usuario">
                    <input type="password" id="login-pass" placeholder="Contraseña">
                    <button onclick="iniciarSesion()" class="btn-blue">Iniciar Sesión</button>
                </div>
                <div id="login-error-msg" class="error-highlight"></div>
            </div>
            <span class="auth-divider">|</span>
            <div class="auth-panel-block">
                <div class="auth-group">
                    <input type="text" id="reg-nick" placeholder="Usuario">
                    <input type="password" id="reg-pass" placeholder="Contraseña">
                    <input type="email" id="reg-email" placeholder="Correo">
                    <button onclick="registrarUsuario()" class="btn-green">Registrarse</button>
                </div>
                <div id="reg-status-msg" class="error-highlight"></div>
            </div>
        </div>
    </div>
    <div class="container">
        <div id="vista-catalogo">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1 class="catalog-title">Inicio</h1>
                </div>
                <button id="btn-abrir-add-juego" onclick="mostrarAgregarJuego()" class="btn-green" style="display: none;">+ Añadir Juego</button>
            </div>
            <div style="margin: 15px 0 25px 0;">
                <input type="text" id="buscar-juego" oninput="filtrarCatalogo()" placeholder="Buscar videojuego por título o género" style="width: 100%; max-width: 400px; padding: 10px 15px; border-radius: 6px; border: 1px solid #334155; background-color: #1e293b; color: #fff; font-size: 14px;">
            </div>
            <div id="lista-juegos-grid" class="catalog-grid"></div>
        </div>
        <div id="vista-foro" style="display: none;">
            <div class="nav-header" style="display: flex; justify-content: space-between;">
                <div>
                    <button onclick="mostrarCatalogoPrincipal()" class="btn-blue" style="background-color: #475569;">Volver</button>
                    <button id="btn-editar-juego" onclick="cargarFormularioEdicion()" class="btn-blue" style="background-color: #d90606; display: none; margin-left: 10px;">Modificar Juego</button>
                </div>
                <button id="btn-eliminar-juego" onclick="eliminarJuegoCatalogo()" class="btn-red" style="display: none; background-color: #e11d48;">Eliminar</button>
            </div>
            <div class="forum-grid">
                <div class="card">
                    <img id="juego-portada-foro" src="" alt="Portada" class="game-forum-img">
                    <h2 id="juego-titulo" class="card-title-blue">--</h2>
                    <p class="card-subtitle">Estudio: <span id="juego-estudio">--</span> | Género: <span id="juego-genero">--</span></p>
                    <h4 class="section-title-green">Precios:</h4>
                    <div id="precios-lista" class="prices-container"></div>
                </div>
                <div class="card">
                    <h3 class="card-title-red">Publicar Reseña</h3>
                    <div class="forum-form">
                        <div style="display: flex; flex-direction: column; gap: 5px;">
                            <label style="font-size: 12px; color: #94a3b8; font-weight: bold;">Autor:</label>
                            <input type="text" id="foro-autor-id" placeholder="Usuario" disabled>
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 5px;">
                            <label style="font-size: 12px; color: #94a3b8; font-weight: bold;">Tu Reseña:</label>
                            <textarea id="foro-contenido" rows="4" placeholder="Inicia sesión para publicar tu reseña" disabled></textarea>
                        </div>
                        <button id="btn-publicar" onclick="publicarReseña()" class="btn-green" disabled style="background-color: #475569; cursor: not-allowed;">Publicar Reseña Oficial</button>
                        <div id="foro-status-msg" class="error-highlight"></div>
                    </div>
                </div>
            </div>
            <div class="card" style="margin-top: 25px;">
                <h3 class="card-title-sky">Más reseñas</h3>
                <div id="muro-social" class="muro-social-wrapper"></div>
            </div>
        </div>
        <div id="vista-agregar-juego" style="display: none;">
            <div class="nav-header">
                <button onclick="mostrarCatalogoPrincipal()" class="btn-blue" style="background-color: #475569;">Volver</button>
            </div>
            <div class="card" style="max-width: 600px; margin: 0 auto;">
                <h2 class="card-title-blue">Registrar Nuevo Juego en el Catálogo</h2>
                <div class="forum-form">
                    <input type="text" id="nuevo-id" placeholder="ID del Juego (ej. GAME_TITULO)">
                    <input type="text" id="nuevo-titulo" placeholder="Título">
                    <input type="text" id="nuevo-desarrolladora" placeholder="Desarrollador">
                    <input type="text" id="nuevo-genero" placeholder="Género">
                    <label style="font-size: 12px; color: #94a3b8; font-weight: bold; margin-top: 10px;">Fecha de Lanzamiento:</label>
                    <input type="date" id="nuevo-fecha">
                    <h4 class="section-title-green" style="margin-top: 20px;">Precio y Tienda Principal</h4>
                    <input type="number" id="nuevo-precio" placeholder="Precio">
                    <input type="text" id="nuevo-tienda" placeholder="Tienda">
                    <input type="text" id="nuevo-url" placeholder="URL">
                    <h4 class="section-title-green" style="margin-top: 20px;">Portada</h4>
                    <input type="file" id="nuevo-portada" accept="image/jpeg, image/jpg">
                    <button onclick="enviarNuevoJuego()" class="btn-green" style="margin-top: 15px;">Guardar</button>
                    <div id="nuevo-status-msg" class="error-highlight"></div>
                </div>
            </div>
        </div>
        <div id="vista-editar-juego" style="display: none;">
            <div class="nav-header">
                <button onclick="abrirForoJuego(juegoActivoId)" class="btn-blue" style="background-color: #475569;">Volver al Foro</button>
            </div>
            <div class="card" style="max-width: 600px; margin: 0 auto;">
                <h2 class="card-title-blue">Modificar Todo el Juego</h2>
                <div class="forum-form">
                    <input type="text" id="edit-titulo" placeholder="Título">
                    <input type="text" id="edit-desarrolladora" placeholder="Desarrollador">
                    <input type="text" id="edit-genero" placeholder="Género">
                    <label style="font-size: 12px; color: #94a3b8; font-weight: bold; margin-top: 10px;">Fecha de Lanzamiento:</label>
                    <input type="date" id="edit-fecha">
                    <h4 class="section-title-green" style="margin-top: 20px;">Precio y Tienda</h4>
                    <input type="number" id="edit-precio" placeholder="Precio">
                    <input type="text" id="edit-tienda" placeholder="Tienda">
                    <input type="text" id="edit-url" placeholder="URL">
                    <h4 class="section-title-green" style="margin-top: 20px;">Actualizar Portada</h4>
                    <input type="file" id="edit-portada" accept="image/jpeg, image/jpg">
                    <button onclick="enviarEdicionJuego()" class="btn-blue" style="background-color: #0681d9; margin-top: 15px;">Guardar Cambios</button>
                    <div id="edit-status-msg" class="error-highlight"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
